@if (selectedObject$ | async; as selectedObject) {
  @if ($any(selectedObject).id.includes('crop')) {
    <button class="options-button mx-1" (click)="imageService.applyCrop()">
      <i class="fa-solid fa-check"></i>
    </button>
    <button class="options-button mx-1" (click)="imageService.cancelCrop()">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <button class="options-button mx-1" (click)="imageService.deleteCrop()">
      <i class="fa-solid fa-trash"></i>
    </button>
  } @else {
    @if (selectedObject.type == 'text' || selectedObject.type == 'textbox') {
      <app-text-options />
    } @else if (selectedObject.type == 'image') {
      <app-image-options />
    }
  }
}
